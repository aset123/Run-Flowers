<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Flower Run — Romantic</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #fff6f7;
    }
    #gameCanvas {
  width: 100vw;
  height: auto;
  max-height: 90vh;
  display: block;

}
    #gameCanvas {
      background: #fff;
      display: block;
      margin: auto;
      border-bottom: 4px solid #c44;

    #scoreBoard {
      text-align: center;
      padding: 10px;
      font-size: 20px;
      background: #fff0f2;
    }
    #logo {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 100px;
      opacity: 100;
    }
  </style>
</head>
<body>
  <img id="logo" src="logo.png" alt="Romantic logo">
  <div id="scoreBoard">Скидка: 0%</div>
  <canvas id="gameCanvas" width="800" height="300"></canvas>
  <script src="flower_run.js"></script>
</body>
</html>
