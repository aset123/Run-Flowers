<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Flower Run Mobile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #fff6f7;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
    }
    #scoreBoard {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 12px;
      font-size: 20px;
      background: #ffe0e8;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="scoreBoard">Скидка: 0%</div>
  <canvas id="gameCanvas"></canvas>
  <button id="restartBtn" style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); padding:10px 20px; font-size:18px; display:none;">Сыграть снова</button>
  <script src="game_final_tuned.js"></script>
</body>
</html>
