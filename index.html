<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Flower Run — Romantic</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #fff6f7;
    }
    #gameCanvas {
  width: 100%;
  height: auto;
  max-width: 800px;
  aspect-ratio: 8 / 3;
      background: #fff;
      display: block;
      margin: auto;
      border-bottom: 4px solid #c44;
    }
    #scoreBoard {
      text-align: center;
      padding: 10px;
      font-size: 20px;
      background: #fff0f2;
    }
    #logo {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 100px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <img id="logo" src="logo.png" alt="Romantic logo">
  <div id="scoreBoard">Скидка: 0%</div>
  <canvas id="gameCanvas"></canvas>
  <script src="flower_run.js"></script>
</body>
</html>
