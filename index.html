<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Flower Run — Romantic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      font-family: sans-serif;
      background: #fff6f7;
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #fff;
    }
    #scoreBoard {
      position: absolute;
      top: 0;
      width: 100%;
      text-align: center;
      padding: 10px;
      font-size: 20px;
      background: #fff0f2;
      z-index: 10;
    }
    #logo {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 100px;
      opacity: 0.9;
      z-index: 10;
    }
  </style>
</head>
<body>
  <img id="logo" src="logo.png" alt="Romantic logo">
  <div id="scoreBoard">Скидка: 0%</div>
  <canvas id="gameCanvas"></canvas>
  <script src="flower_run_mobile_scaled.js"></script>
</body>
</html>
