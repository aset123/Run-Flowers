<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1" />
  <title>Mobile Platformer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #f0f0f0;
      font-family: sans-serif;
      touch-action: none;
    }
    canvas {
      display: block;
      background: #87ceeb;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      color: #333;
      font-weight: bold;
    }
    #restartBtn {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      font-size: 20px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #soundToggle {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 18px;
      background: white;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid #999;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="score">Скидка: 0.0%</div>
  <button id="restartBtn" onclick="restartGame()">Играть снова</button>
  <button id="soundToggle" onclick="toggleSound()">🔊</button>
  <canvas id="gameCanvas"></canvas>

  <audio id="flowerSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5f6fa31e6b.mp3?filename=collectcoin-6075.mp3"></audio>
  <audio id="hitSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_2e2673f1a6.mp3?filename=error-126627.mp3"></audio>
  <audio id="bgMusic" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_93a5a4dd5d.mp3?filename=arcade-music-loop-112233.mp3" loop></audio>

  <script>

    // Но будет вставлен при сохранении файла
  </script>
</body>
</html>
