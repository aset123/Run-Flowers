<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Flower Run Fixed Size</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff6f7;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: auto;
      background: #ffffff;
    }
    #scoreBoard {
      position: absolute;
      top: 0;
      width: 100%;
      text-align: center;
      padding: 12px;
      font-size: 20px;
      background: #ffe0e8;
      z-index: 10;
    }
    #restartBtn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 18px;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="scoreBoard">Скидка: 0%</div>
  <canvas id="gameCanvas" width="1284" height="2778"></canvas>
  <button id="restartBtn">Сыграть снова</button>
  <script src="game_fixed.js"></script>
</body>
</html>
