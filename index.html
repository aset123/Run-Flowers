<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Flower Run Camera View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff6f7;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      background: #ffffff;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    #scoreBoard {
      position: absolute;
      top: 0;
      width: 100%;
      text-align: center;
      padding: 12px;
      font-size: 20px;
      background: #ffe0e8;
      z-index: 10;
    }
    #restartBtn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 18px;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="scoreBoard">Скидка: 0%</div>
  <canvas id="gameCanvas" width="640" height="360"></canvas>
  <button id="restartBtn">Сыграть снова</button>
  <script src="game.js"></script>
</body>
</html>
